---
name: "Lint PR"

on:
  pull_request:
    types: [ opened, edited, synchronize, reopened ]

permissions:
  pull-requests: read

jobs:
  pr-lint:
    name: Validate commits
    runs-on: ubuntu-latest
    steps:
    - uses: webiny/action-conventional-commits@v1.4.2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
